<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Demo</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        .box {
            background-color: #3498db;
            color: white;
            padding: 20px;
            margin: 10px;
            border: 5px solid #2980b9;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s;
        }
        .box:hover {
            transform: scale(1.05);
            background-color: #e74c3c;
            border-color: #c0392b;
        }
        .flex-container {
            display: flex;
            justify-content: space-around;
            background-color: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h3>Box Model & Hover Effects</h3>
    <div class="box">Hover Me!</div>

    <h3>Flexbox Layout</h3>
    <div class="flex-container">
        <div class="box" style="margin: 0">Item 1</div>
        <div class="box" style="margin: 0">Item 2</div>
        <div class="box" style="margin: 0">Item 3</div>
    </div>
</body>
</html>
